name: FleetOps CI and publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleetops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate FleetOps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and domain rules
        run: |
          pnpm exec tsc --noEmit
          node scripts/check-model.mjs
          node scripts/check-calendarization.mjs
          node scripts/check-browser-alerts.mjs
          node scripts/check-stela-voice.mjs
          node scripts/check-stela-cloud-voice.mjs
          node scripts/check-elevenlabs-errors.mjs
          node scripts/check-gateway.mjs
          node scripts/check-cloudflare-gateway.mjs
          node scripts/check-deployment.mjs
      - name: Build Worker and client
        run: pnpm build
      - name: Check Worker, database and integrations
        run: node scripts/check-worker.mjs

  publish:
    name: Publish FleetOps through Sites
    needs: validate
    if: github.repository == 'RomuloLab/fleetops-smg1' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Request publication and verify live commit
        run: node scripts/request-sites-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
